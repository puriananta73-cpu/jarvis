name: Build Android APK

on:
  push:
    branches: [ "**" ]
  release:
    types: [ published, created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      _JAVA_OPTIONS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -Djava.awt.headless=true\" -Djava.awt.headless=true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "platform-tools" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Prepare Debug Keystore, Services & Secrets
        env:
          INPUT_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          API_KEY="${INPUT_GEMINI_KEY:-AIzaSyPlaceholderKeyForBuildingJarvisApp}"
          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "GEMINI_API_KEY=$API_KEY" > .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123","project_id":"app","storage_bucket":"app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.aistudio.jarvisassistant.licaaa"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build APK with Gradle
        run: gradle :app:assembleDebug -x test -x lint -x verifyRoborazziDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jarvis-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
